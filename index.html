<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0f1419" />
  <title>CSA Who's Who</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a222c;
      --surface-2: #243040;
      --text: #f2f4f7;
      --muted: #8b97a8;
      --accent: #3dd6c6;
      --accent-dim: rgba(61, 214, 198, 0.15);
      --miss: #f07178;
      --miss-dim: rgba(240, 113, 120, 0.15);
      --ok: #7fd99a;
      --ok-dim: rgba(127, 217, 154, 0.15);
      --radius: 20px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "DM Sans", system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      padding: calc(12px + var(--safe-top)) 16px calc(12px + var(--safe-bottom));
      max-width: 480px;
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .brand {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .progress {
      font-size: 0.85rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .bar {
      height: 3px;
      background: var(--surface-2);
      border-radius: 999px;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .bar > span {
      display: block;
      height: 100%;
      background: var(--accent);
      border-radius: 999px;
      width: 0%;
      transition: width 0.25s ease;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .stage {
      flex: 1;
      perspective: 1200px;
      min-height: 0;
      position: relative;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
      cursor: pointer;
    }

    .card.flipped { transform: rotateY(180deg); }

    .face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    }

    .face.back {
      transform: rotateY(180deg);
      background: linear-gradient(160deg, #1e2a38 0%, #15202b 100%);
      padding: 24px;
      text-align: center;
    }

    .face img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    .hint {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 20, 25, 0.72);
      backdrop-filter: blur(8px);
      color: var(--text);
      font-size: 0.8rem;
      font-weight: 500;
      padding: 8px 14px;
      border-radius: 999px;
      pointer-events: none;
      opacity: 0.95;
      transition: opacity 0.2s;
    }

    .card.flipped .hint { opacity: 0; }

    .name {
      font-size: clamp(1.75rem, 7vw, 2.35rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 8px;
    }

    .sub {
      color: var(--accent);
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      font: inherit;
      border: none;
      border-radius: 14px;
      padding: 14px 12px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.12s ease, background 0.15s;
    }

    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.4; cursor: default; transform: none; }

    .btn-miss {
      background: var(--miss-dim);
      color: var(--miss);
    }

    .btn-got {
      background: var(--ok-dim);
      color: var(--ok);
    }

    .toolbar {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-shrink: 0;
    }

    .toolbar button {
      flex: 1;
      background: var(--surface);
      color: var(--muted);
      padding: 12px;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .toolbar button:hover { color: var(--text); }

    .done {
      display: none;
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 12px;
      padding: 24px;
    }

    .done.show { display: flex; }
    .stage.hide, .actions.hide, .toolbar.hide { display: none; }

    .done h2 {
      font-size: 1.8rem;
      letter-spacing: -0.02em;
    }

    .done p { color: var(--muted); line-height: 1.45; }

    .done .stats {
      display: flex;
      gap: 20px;
      margin: 8px 0 16px;
      font-variant-numeric: tabular-nums;
    }

    .done .stats div {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .done .stats strong { font-size: 1.4rem; }
    .done .stats span { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }

    .restart {
      background: var(--accent);
      color: #0a1210;
      padding: 14px 28px;
      border-radius: 14px;
      font-weight: 700;
    }

    .retry {
      background: var(--surface);
      color: var(--text);
      padding: 14px 28px;
      border-radius: 14px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">CSA Who's Who</div>
    <div class="progress" id="progress">1 / 32</div>
  </header>
  <div class="bar"><span id="bar"></span></div>

  <main>
    <div class="stage" id="stage">
      <div class="card" id="card" aria-label="Flashcard — tap to flip">
        <div class="face front">
          <img id="photo" alt="Exec headshot" />
          <div class="hint">Tap to reveal</div>
        </div>
        <div class="face back">
          <div class="name" id="name"></div>
          <div class="sub" id="dept"></div>
        </div>
      </div>
    </div>

    <div class="actions" id="actions">
      <button class="btn-miss" id="miss" type="button">Still learning</button>
      <button class="btn-got" id="got" type="button">Got it</button>
    </div>

    <div class="done" id="done">
      <h2>Nice work</h2>
      <p id="doneMsg">You worked through the deck.</p>
      <div class="stats">
        <div><strong id="statGot">0</strong><span>Got it</span></div>
        <div><strong id="statMiss">0</strong><span>Still learning</span></div>
      </div>
      <button class="restart" id="restart" type="button">Practice again</button>
      <button class="retry" id="retryMissed" type="button">Retry missed only</button>
    </div>

    <div class="toolbar" id="toolbar">
      <button type="button" id="undo" disabled>Undo</button>
      <button type="button" id="shuffle">Shuffle</button>
      <button type="button" id="reset">Reset</button>
    </div>
  </main>

  <script>
    const PEOPLE = [
      { name: "Keiyu Wang", file: "keiyu-wang.jpg", dept: "Finance" },
      { name: "Lucas Xue", file: "lucas-xue.jpg", dept: "Finance" },
      { name: "Jackson Wang", file: "jackson-wang.jpg", dept: "Finance" },
      { name: "Emma Dong", file: "emma-dong.jpg", dept: "Finance" },
      { name: "Niki Zhang", file: "niki-zhang.jpg", dept: "Finance" },
      { name: "Dane Park", file: "dane-park.jpg", dept: "Events" },
      { name: "Jade He", file: "jade-he.jpg", dept: "Events" },
      { name: "Katherine Li", file: "katherine-li.jpg", dept: "Events" },
      { name: "Justin Xie", file: "justin-xie.jpg", dept: "Events" },
      { name: "Fred Fang", file: "fred-fang.jpg", dept: "Events" },
      { name: "Emily Kam", file: "emily-kam.png", dept: "Events" },
      { name: "Casper Chen", file: "casper-chen.png", dept: "Graphics" },
      { name: "Ethan Wen-Je Lee", file: "ethan-wen-je-lee.jpg", dept: "Graphics" },
      { name: "Xavier Zou", file: "xavier-zou.jpg", dept: "Graphics" },
      { name: "Christine Liang", file: "christine-liang.jpg", dept: "Graphics" },
      { name: "Isabel Cheung", file: "isabel-cheung.jpg", dept: "Graphics" },
      { name: "Caitlyn Chen", file: "caitlyn-chen.jpg", dept: "Marketing" },
      { name: "Trey Ip", file: "trey-ip.jpg", dept: "Marketing" },
      { name: "Megan Chui", file: "megan-chui.jpg", dept: "Marketing" },
      { name: "Andy Chen", file: "andy-chen.jpg", dept: "Marketing" },
      { name: "Clare Zhang", file: "clare-zhang.jpg", dept: "Member Relations" },
      { name: "Nathan Hu", file: "nathan-hu.png", dept: "Member Relations" },
      { name: "Aubrey Yu", file: "aubrey-yu.jpg", dept: "Member Relations" },
      { name: "Matthew Qin", file: "matthew-qin.jpg", dept: "Member Relations" },
      { name: "Chloe Cheng", file: "chloe-cheng.jpg", dept: "Member Relations" },
      { name: "Anna Chen", file: "anna-chen.jpg", dept: "Member Relations" },
      { name: "Zoie Mao", file: "zoie-mao.jpg", dept: "Productions" },
      { name: "Judy Li", file: "judy-li.jpg", dept: "Productions" },
      { name: "Nuo Zhang", file: "nuo-zhang.jpg", dept: "Productions" },
      { name: "Jeffrey Ban", file: "jeffrey-ban.jpg", dept: "Productions" },
      { name: "Rain Li", file: "rain-li.jpg", dept: "Productions" },
      { name: "Zinger Xu", file: "zinger-xu.jpg", dept: "Productions" },
    ];

    const card = document.getElementById("card");
    const photo = document.getElementById("photo");
    const nameEl = document.getElementById("name");
    const deptEl = document.getElementById("dept");
    const progress = document.getElementById("progress");
    const bar = document.getElementById("bar");
    const stage = document.getElementById("stage");
    const actions = document.getElementById("actions");
    const toolbar = document.getElementById("toolbar");
    const done = document.getElementById("done");

    let deck = [];
    let index = 0;
    let flipped = false;
    let got = 0;
    let miss = 0;
    let missedPeople = [];
    let history = [];
    const undoBtn = document.getElementById("undo");

    function updateUndo() {
      undoBtn.disabled = history.length === 0;
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function start(source = PEOPLE) {
      deck = shuffle(source);
      index = 0;
      flipped = false;
      got = 0;
      miss = 0;
      missedPeople = [];
      history = [];
      done.classList.remove("show");
      stage.classList.remove("hide");
      actions.classList.remove("hide");
      toolbar.classList.remove("hide");
      updateUndo();
      show();
    }

    function show() {
      if (index >= deck.length) {
        finish();
        return;
      }
      const person = deck[index];
      flipped = false;
      card.classList.remove("flipped");
      photo.src = `images/${encodeURIComponent(person.file)}`;
      photo.alt = "Who is this?";
      nameEl.textContent = person.name;
      deptEl.textContent = person.dept;
      progress.textContent = `${index + 1} / ${deck.length}`;
      bar.style.width = `${(index / deck.length) * 100}%`;
      updateUndo();
    }

    function flip() {
      flipped = !flipped;
      card.classList.toggle("flipped", flipped);
    }

    function advance(knew) {
      const person = deck[index];
      history.push({ knew, person });
      if (knew) got += 1;
      else {
        miss += 1;
        missedPeople.push(person);
      }
      index += 1;
      show();
    }

    function undo() {
      if (!history.length) return;
      const last = history.pop();
      if (last.knew) got = Math.max(0, got - 1);
      else {
        miss = Math.max(0, miss - 1);
        const i = missedPeople.lastIndexOf(last.person);
        if (i >= 0) missedPeople.splice(i, 1);
      }
      index = Math.max(0, index - 1);
      done.classList.remove("show");
      stage.classList.remove("hide");
      actions.classList.remove("hide");
      toolbar.classList.remove("hide");
      show();
    }

    function finish() {
      stage.classList.add("hide");
      actions.classList.add("hide");
      // keep toolbar visible so Undo still works on the last card
      toolbar.classList.remove("hide");
      done.classList.add("show");
      document.getElementById("statGot").textContent = got;
      document.getElementById("statMiss").textContent = miss;
      document.getElementById("doneMsg").textContent =
        miss === 0
          ? "You recognized everyone. Strong."
          : `You marked ${miss} to keep practicing.`;
      document.getElementById("retryMissed").style.display =
        missedPeople.length ? "inline-block" : "none";
      bar.style.width = "100%";
      progress.textContent = "Done";
      updateUndo();
    }

    card.addEventListener("click", flip);
    document.getElementById("got").addEventListener("click", () => advance(true));
    document.getElementById("miss").addEventListener("click", () => advance(false));
    undoBtn.addEventListener("click", undo);
    document.getElementById("shuffle").addEventListener("click", () => start(PEOPLE));
    document.getElementById("reset").addEventListener("click", () => {
      if (confirm("Reset the deck? Your progress will be cleared.")) start(PEOPLE);
    });
    document.getElementById("restart").addEventListener("click", () => start(PEOPLE));
    document.getElementById("retryMissed").addEventListener("click", () => {
      start(missedPeople.length ? missedPeople : PEOPLE);
    });

    // Swipe left/right after flip to mark miss/got
    let touchX = null;
    stage.addEventListener("touchstart", (e) => {
      touchX = e.changedTouches[0].screenX;
    }, { passive: true });
    stage.addEventListener("touchend", (e) => {
      if (touchX == null) return;
      const dx = e.changedTouches[0].screenX - touchX;
      touchX = null;
      if (Math.abs(dx) < 60) return;
      if (!flipped) {
        flip();
        return;
      }
      if (dx < 0) advance(true);
      else advance(false);
    }, { passive: true });

    start();
  </script>
</body>
</html>
